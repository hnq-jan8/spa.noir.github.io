name: Update content

on:
  repository_dispatch:
    types: [directus-content-update]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
          sparse-checkout-cone-mode: false

      - name: Download latest built site
        id: download
        run: |
          RUN_ID=$(gh run list \
            --workflow deploy-layout.yml \
            --branch main \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId' \
            --repo ${{ github.repository }})

          if [ -z "$RUN_ID" ]; then
            echo "::notice::No layout build found — triggering full build instead."
            gh workflow run deploy-layout.yml --repo ${{ github.repository }}
            echo "fallback=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! gh run download "$RUN_ID" --name built-site --dir out --repo ${{ github.repository }}; then
            echo "::notice::Artifact expired (run $RUN_ID) — triggering full build instead."
            gh workflow run deploy-layout.yml --repo ${{ github.repository }}
            echo "fallback=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Fetch fresh content from Directus
        if: steps.download.outputs.fallback != 'true'
        run: node scripts/fetch-json.mjs
        env:
          DIRECTUS_URL: ${{ vars.DIRECTUS_URL }}
          DIRECTUS_STATIC_TOKEN: ${{ secrets.DIRECTUS_STATIC_TOKEN }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}

      - uses: actions/configure-pages@v5
        if: steps.download.outputs.fallback != 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.download.outputs.fallback != 'true'
        with:
          path: out

      - id: deployment
        if: steps.download.outputs.fallback != 'true'
        uses: actions/deploy-pages@v4
